<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <div class="modal-dialog" role="dialog" aria-modal="true" [attr.aria-label]="ui.t('Import from Ultimate Guitar')">

    <div class="modal-header">
      <h2 class="modal-title">{{ ui.t('Import from Ultimate Guitar') }}</h2>
      <button class="close-btn" (click)="sessionsSvc.closeImportUrlModal()" title="Close" [disabled]="isLoading">✕</button>
    </div>

    <div class="import-body">
      <input
        class="url-input"
        type="url"
        [(ngModel)]="url"
        [placeholder]="ui.t('Paste an ultimate-guitar.com URL')"
        [disabled]="isLoading"
        (keydown.enter)="submit()"
        autofocus
      />

      <button class="import-btn" (click)="submit()" [disabled]="isLoading || !url.trim()">
        @if (isLoading) {
          <span class="opt-spinner"></span>{{ ui.t('Importing…') }}
        } @else {
          {{ ui.t('Import') }}
        }
      </button>

      @if (error) {
        <p class="import-error">{{ ui.t(error) }}</p>
      }

      <p class="import-hint">{{ ui.t('Open a chords page on ultimate-guitar.com and paste its link.') }}</p>
    </div>

  </div>
</div>
